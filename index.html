<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колода Харроу — Проклятие Алого Трона</title>
<style>
  :root {
    --bg: #141115;
    --panel: #1f1a21;
    --border: #4a3b32;
    --gold: #d4af37;
    --crimson: #9e2a2b;
    --text: #ece4d8;
    --muted: #a3988c;
    --match-suit: #3b82f6;
    --match-role: #10b981;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  h1, h2, h3 { margin: 0 0 10px; color: var(--gold); font-weight: 600; }
  .container { max-width: 1280px; margin: 0 auto; }
  #errBox {
    display: none; background: #7f1d1d; color: #fecaca;
    padding: 12px; border-radius: 8px; margin-bottom: 14px; font-family: monospace;
  }
  .top-bar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: space-between; background: var(--panel);
    padding: 14px 18px; border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 16px;
  }
  select, input, button {
    background: #2b242e; color: var(--text); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 6px; font-size: 14px;
  }
  button { cursor: pointer; transition: 0.15s; font-weight: 500; }
  button:hover { border-color: var(--gold); background: #382f3c; }
  button.primary { background: var(--crimson); border-color: #c94a4a; color: #fff; }
  button.primary:hover { background: #b53334; }
  button.gold-btn { background: #594616; border-color: var(--gold); color: #fff; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
  @media (max-width: 920px) { .layout { grid-template-columns: 1fr; } }
  .card-box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; margin-bottom: 14px;
  }
  .rules-hint { font-size: 13px; color: var(--muted); line-height: 1.45; }
  .rules-hint strong { color: var(--text); }
  .player-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 8px; background: #262029; border-radius: 6px;
    margin-bottom: 8px; border: 1px solid #362d3a;
  }
  .player-info { font-size: 13px; }
  .player-role { color: var(--gold); font-weight: 600; display: block; margin-top: 2px; }
  .hp-badge {
    background: var(--crimson); color: #fff; padding: 3px 8px;
    border-radius: 12px; font-size: 12px; font-weight: bold; white-space: nowrap;
  }
  .spread-header {
    display: grid; grid-template-columns: 70px repeat(3, 1fr);
    gap: 10px; text-align: center; font-weight: 600; color: var(--gold);
    margin-bottom: 8px; font-size: 14px;
  }
  .spread-grid {
    display: grid; grid-template-columns: 70px repeat(3, 1fr);
    gap: 10px; align-items: center;
  }
  .row-label {
    writing-mode: vertical-rl; transform: rotate(180deg);
    text-align: center; color: var(--muted); font-size: 13px; font-weight: 600;
    justify-self: center;
  }
  .slot {
    background: #19151b; border: 2px solid var(--border); border-radius: 8px;
    padding: 8px; text-align: center; position: relative; min-height: 250px;
    display: flex; flex-direction: column; justify-content: space-between;
    cursor: pointer; transition: transform 0.15s, border-color 0.2s;
  }
  .slot:hover { transform: translateY(-2px); }
  .slot.suit-match { border-color: var(--match-suit); box-shadow: 0 0 12px rgba(59,130,246,0.35); }
  .slot.role-match { border-color: var(--match-role); box-shadow: 0 0 14px rgba(16,185,129,0.45); }
  .slot-align { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .card-img {
    width: 100%; max-width: 155px; aspect-ratio: 2/3; object-fit: cover;
    border-radius: 6px; margin: 0 auto; display: block; border: 1px solid #333;
  }
  .card-back {
    width: 100%; max-width: 155px; aspect-ratio: 2/3; margin: 0 auto;
    border-radius: 6px; border: 2px solid var(--gold);
    background: radial-gradient(circle, #3b1d2a 0%, #1a1118 100%);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold); font-size: 28px; user-select: none;
  }
  .card-title { font-size: 13px; font-weight: 600; margin-top: 6px; }
  .card-sub { font-size: 11px; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 5px; }
  .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
  .tag.suit { background: rgba(59,130,246,0.25); color: #93c5fd; }
  .tag.role { background: rgba(16,185,129,0.25); color: #6ee7b7; }
  .tag.opp { background: rgba(239,68,68,0.25); color: #fca5a5; }
  .extra-cards { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .mini-card { width: 110px; text-align: center; font-size: 11px; }
  .mini-card img { width: 100%; border-radius: 4px; }
  .toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--gold);
    color: #141115; padding: 10px 16px; border-radius: 8px; font-weight: 600;
    display: none; z-index: 99;
  }
</style>
</head>
<body>
<div class="container">
  <div id="errBox"></div>

  <div class="top-bar">
    <div>
      <h1>Колода Харроу: Проклятие Алого Трона</h1>
      <div style="font-size:13px; color:var(--muted);">Нажмите на закрытую карту в раскладе, чтобы перевернуть её</div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="gold-btn" onclick="copyShareLink()">🔗 Скопировать ссылку для игроков</button>
      <button onclick="resetAll()">Сбросить всё</button>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="card-box">
        <h3>1. Глава кампании</h3>
        <select id="chapterSelect" style="width:100%; margin-bottom:10px;" onchange="changeChapter()"></select>
        <div id="chapterInfo" class="rules-hint"></div>
      </div>

      <div class="card-box">
        <h3>2. Этап «Выбор» (Карты Роли)</h3>
        <div style="display:flex; gap:6px; margin-bottom:10px;">
          <input type="text" id="playerNameInput" placeholder="Имя персонажа..." style="flex:1;" onkeydown="if(event.key==='Enter') addPlayer()">
          <button onclick="addPlayer()">+ Добавить</button>
        </div>
        <button class="primary" style="width:100%; margin-bottom:10px;" onclick="dealRoleCards()">Раздать Карты Роли (из масти главы)</button>
        <div id="playersList"></div>
      </div>

      <div class="card-box">
        <h3>3. Добор из остатка колоды</h3>
        <div style="font-size:13px; color:var(--muted); margin-bottom:8px;">
          Осталось в колоде: <strong id="deckCount" style="color:var(--text);">54</strong> карт
        </div>
        <button style="width:100%;" onclick="drawExtraCard()">Вытянуть случайную карту</button>
        <div id="extraCards" class="extra-cards"></div>
      </div>
    </div>

    <div>
      <div class="card-box">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
          <h3>4. Расклад Харроу (3×3)</h3>
          <div style="display:flex; gap:8px;">
            <button class="primary" onclick="dealSpread()">Сделать новый расклад</button>
            <button onclick="revealAll()">Открыть все карты</button>
          </div>
        </div>

        <div class="spread-header">
          <div></div>
          <div>Прошлое (Закон)</div>
          <div>Настоящее (Нейтр.)</div>
          <div>Будущее (Хаос)</div>
        </div>
        <div id="spreadGrid" class="spread-grid"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast">Ссылка скопирована!</div>

<script>
window.onerror = function(msg, url, line) {
  const box = document.getElementById("errBox");
  if (box) {
    box.style.display = "block";
    box.textContent = "Ошибка скрипта: " + msg + " (строка " + line + ")";
  }
};

const SUITS = {
  hammers: { name: "Молоты", stat: "Сила" },
  keys:    { name: "Ключи",  stat: "Ловкость" },
  shields: { name: "Щиты",   stat: "Выносливость" },
  books:   { name: "Книги",  stat: "Интеллект" },
  stars:   { name: "Звёзды", stat: "Мудрость" },
  crowns:  { name: "Короны", stat: "Харизма" }
};

const CHAPTERS = [
  {
    id: 1, title: "Глава 1: На краю анархии", suit: "keys",
    spend: "Трата Очков Харроу: переброс проверки Ловкости (до оглашения результата), +1 к скорости на сцену или бонус уклонения +2 к КБ на 1 раунд."
  },
  {
    id: 2, title: "Глава 2: Семь дней до могилы", suit: "shields",
    spend: "Трата Очков Харроу: переброс спасброска Стойкости или проверки Выносливости, +2 к спасброскам против болезней на день, либо лечение 1к8+уровень ПЗ."
  },
  {
    id: 3, title: "Глава 3: Побег из Старой Корвосы", suit: "books",
    spend: "Трата Очков Харроу: переброс проверки Интеллекта или Знаний, получение подсказки от ведущего, либо +2 к КБ/спасброскам против ловушек и загадок."
  },
  {
    id: 4, title: "Глава 4: История пепла", suit: "hammers",
    spend: "Трата Очков Харроу: переброс броска атаки или проверки Силы, +2 к урону в ближнем бою на 1 раунд, либо игнорирование штрафных условий усталости на сцену."
  },
  {
    id: 5, title: "Глава 5: Скелеты Скарволла", suit: "stars",
    spend: "Трата Очков Харроу: переброс спасброска Воли или проверки Внимания/Проницательности, либо +2 к спасброскам против эффектов страха и нежити."
  },
  {
    id: 6, title: "Глава 6: Корона клыков", suit: "crowns",
    spend: "Трата Очков Харроу: переброс проверки Харизмы (Дипломатия, Блеф, Запугивание) или бонус +2 к КБ/спасброскам против зачарования и контроля разума."
  }
];

const ALIGNMENTS = [
  "Законно-Добрый", "Нейтрально-Добрый", "Хаотично-Добрый",
  "Законно-Нейтральный", "Истинно Нейтральный", "Хаотично-Нейтральный",
  "Законно-Злой", "Нейтрально-Злой", "Хаотично-Злой"
];

const OPPOSITE_SLOTS = [8, 7, 6, 5, 4, 3, 2, 1, 0];

const RAW_CARDS = [
{ ru: "Паладин", en: "Paladin", suit: "hammers", file: "01_paladin.png" },
{ ru: "Твердыня", en: "Keep", suit: "hammers", file: "02_keep.png" },
{ ru: "Небо", en: "Sky", suit: "hammers", file: "03_sky.png" },
{ ru: "Кузница", en: "Forge", suit: "hammers", file: "04_forge.png" },
{ ru: "Медведь", en: "Bear", suit: "hammers", file: "05_bear.png" },
{ ru: "Восстание", en: "Uprising", suit: "hammers", file: "06_uprising.png" },
{ ru: "Исчадие", en: "Fiend", suit: "hammers", file: "07_fiend.png" },
{ ru: "Избиение", en: "Beating", suit: "hammers", file: "08_beating.png" },
{ ru: "Циклон", en: "Cyclone", suit: "hammers", file: "09_cyclone.png" },
{ ru: "Танец", en: "Dance", suit: "keys", file: "10_dance.png" },
{ ru: "Сверчок", en: "Cricket", suit: "keys", file: "11_cricket.png" },
{ ru: "Жонглёр", en: "Juggler", suit: "keys", file: "12_juggler.png" },
{ ru: "Замочник", en: "Locksmith", suit: "keys", file: "13_locksmith.png" },
{ ru: "Павлин", en: "Peacock", suit: "keys", file: "14_peacock.png" },
{ ru: "Кролик", en: "Rabbit", suit: "keys", file: "15_rabbit.png" },
{ ru: "Лавина", en: "Avalanche", suit: "keys", file: "16_avalanche.png" },
{ ru: "Вороны", en: "Crows", suit: "keys", file: "17_crows.png" },
{ ru: "Фонарь", en: "Lantern", suit: "keys", file: "18_lantern.png" },
{ ru: "Труба", en: "Trumpet", suit: "shields", file: "19_trumpet.png" },
{ ru: "Выживший", en: "Survivor", suit: "shields", file: "20_survivor.png" },
{ ru: "Пустыня", en: "Desert", suit: "shields", file: "21_desert.png" },
{ ru: "Медь", en: "Brass", suit: "shields", file: "22_brass.png" },
{ ru: "Возница", en: "Teamster", suit: "shields", file: "23_teamster.png" },
{ ru: "Гора", en: "Mountain", suit: "shields", file: "24_mountain.png" },
{ ru: "Терновник", en: "Briar", suit: "shields", file: "25_briar.png" },
{ ru: "Хворь", en: "Sickness", suit: "shields", file: "26_sickness.png" },
{ ru: "Восковые фигуры", en: "Waxworks", suit: "shields", file: "27_waxworks.png" },
{ ru: "Истина", en: "Truth", suit: "books", file: "28_truth.png" },
{ ru: "Странник", en: "Wanderer", suit: "books", file: "29_wanderer.png" },
{ ru: "Шутка", en: "Joke", suit: "books", file: "30_joke.png" },
{ ru: "Инквизитор", en: "Inquisitor", suit: "books", file: "31_inquisitor.png" },
{ ru: "Торговец", en: "Trader", suit: "books", file: "32_trader.png" },
{ ru: "Видение", en: "Vision", suit: "books", file: "33_vision.png" },
{ ru: "Ракшаса", en: "Rakshasa", suit: "books", file: "34_rakshasa.png" },
{ ru: "Идиот", en: "Idiot", suit: "books", file: "35_idiot.png" },
{ ru: "Змеиный укус", en: "Snakebite", suit: "books", file: "36_snakebite.png" },
{ ru: "Змей", en: "Serpent", suit: "stars", file: "37_serpent.png" },
{ ru: "Повитуха", en: "Midwife", suit: "stars", file: "38_midwife.png" },
{ ru: "Трактирщик", en: "Publican", suit: "stars", file: "39_publican.png" },
{ ru: "Королева", en: "Queen", suit: "stars", file: "40_queen.png" },
{ ru: "Сова", en: "Owl", suit: "stars", file: "41_owl.png" },
{ ru: "Карнавал", en: "Carnival", suit: "stars", file: "42_carnival.png" },
{ ru: "Затмение", en: "Eclipse", suit: "stars", file: "43_eclipse.png" },
{ ru: "Карга", en: "Hag", suit: "stars", file: "44_hag.png" },
{ ru: "Потерянный", en: "Lost", suit: "stars", file: "45_lost.png" },
{ ru: "Трон", en: "Throne", suit: "crowns", file: "46_throne.png" },
{ ru: "Театр", en: "Theater", suit: "crowns", file: "47_theater.png" },
{ ru: "Единорог", en: "Unicorn", suit: "crowns", file: "48_unicorn.png" },
{ ru: "Брак", en: "Marriage", suit: "crowns", file: "49_marriage.png" },
{ ru: "Близнец", en: "Twin", suit: "crowns", file: "50_twin.png" },
{ ru: "Куртизанка", en: "Courtesan", suit: "crowns", file: "51_courtesan.png" },
{ ru: "Тиран", en: "Tyrant", suit: "crowns", file: "52_tyrant.png" },
{ ru: "Предательство", en: "Betrayal", suit: "crowns", file: "53_betrayal.png" },
{ ru: "Лжец", en: "Liar", suit: "crowns", file: "54_liar.png" }
];
const DECK = RAW_CARDS.map((c, idx) => ({
id: idx,
ru: c.ru,
en: c.en,
suit: c.suit,
file: "cards/" + c.file,
alignIdx: idx % 9
}));
let state = {
chapter: 1,
players: [],
spread: [],
revealed: [false, false, false, false, false, false, false, false, false],
extra: []
};
function init() {
const sel = document.getElementById("chapterSelect");
CHAPTERS.forEach(ch => {
const opt = document.createElement("option");
opt.value = ch.id;
opt.textContent = ch.title + " (" + SUITS[ch.suit].name + ")";
sel.appendChild(opt);
});
if (location.hash.length > 1) {
try {
const decoded = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
Object.assign(state, decoded);
} catch (e) {}
}
sel.value = state.chapter;
render();
}
function saveToHash() {
const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
history.replaceState(null, "", "#" + encoded);
}
function changeChapter() {
state.chapter = Number(document.getElementById("chapterSelect").value);
render();
}
function addPlayer() {
const inp = document.getElementById("playerNameInput");
const name = inp.value.trim();
if (!name) return;
if (state.players.length >= 9) {
alert("Максимум 9 игроков на 9 карт масти!");
return;
}
state.players.push({ name: name, roleCardId: null });
inp.value = "";
render();
}
function removePlayer(idx) {
state.players.splice(idx, 1);
render();
}
function dealRoleCards() {
if (state.players.length === 0) {
alert("Сначала добавьте хотя бы одного игрока.");
return;
}
const ch = CHAPTERS.find(c => c.id === state.chapter);
const suitCards = DECK.filter(c => c.suit === ch.suit).map(c => c.id);
const shuffled = getShuffled(suitCards);
state.players.forEach((p, i) => {
p.roleCardId = shuffled.at(i);
});
render();
}
function dealSpread() {
const ids = DECK.map(c => c.id);
const shuffled = getShuffled(ids);
state.spread = shuffled.slice(0, 9);
state.revealed = [false, false, false, false, false, false, false, false, false];
state.extra = [];
render();
}
function toggleReveal(slotIdx) {
if (state.spread.length < 9) return;
state.revealed = state.revealed.map((val, idx) => idx === slotIdx ? !val : val);
render();
}
function revealAll() {
if (state.spread.length < 9) return;
state.revealed = [true, true, true, true, true, true, true, true, true];
render();
}
function drawExtraCard() {
const used = new Set([...state.spread, ...state.extra]);
const avail = DECK.map(c => c.id).filter(id => !used.has(id));
if (avail.length === 0) {
alert("В колоде больше не осталось карт!");
return;
}
const shuffled = getShuffled(avail);
state.extra.push(shuffled.at(0));
render();
}
function resetAll() {
state = {
chapter: state.chapter,
players: [],
spread: [],
revealed: [false, false, false, false, false, false, false, false, false],
extra: []
};
render();
}
function copyShareLink() {
saveToHash();
navigator.clipboard.writeText(location.href).then(() => {
const t = document.getElementById("toast");
t.style.display = "block";
setTimeout(() => t.style.display = "none", 2200);
});
}
function getShuffled(arr) {
return arr
.map(item => ({ item: item, sort: Math.random() }))
.sort((a, b) => a.sort - b.sort)
.map(obj => obj.item);
}
function calcHarrowPoints(player) {
const ch = CHAPTERS.find(c => c.id === state.chapter);
let hp = 0;
state.spread.forEach((cardId, slotIdx) => {
if (!state.revealed.at(slotIdx)) return;
const card = DECK.at(cardId);
if (card.suit === ch.suit) hp += 1;
if (player.roleCardId === cardId) {
hp += 1;
if (card.alignIdx === slotIdx) hp += 1;
}
});
return hp;
}
function render() {
saveToHash();
const ch = CHAPTERS.find(c => c.id === state.chapter);
const suitObj = SUITS[ch.suit];
document.getElementById("chapterInfo").innerHTML =
"Масть главы: " + suitObj.name + " (" + suitObj.stat + ")" +
"" + ch.spend + "";
const pList = document.getElementById("playersList");
pList.innerHTML = "";
state.players.forEach((p, idx) => {
const rCard = p.roleCardId !== null ? DECK.at(p.roleCardId) : null;
const hp = calcHarrowPoints(p);
const div = document.createElement("div");
div.className = "player-row";
div.innerHTML =
"" +
"" + p.name + "" +
"" + (rCard ? ("Роль: " + rCard.ru + " (" + rCard.en + ")") : "Карта Роли не вытянута") + "" +
"" +
"" +
"" + hp + " ОХ" +
"✕" +
"";
pList.appendChild(div);
});
const grid = document.getElementById("spreadGrid");
grid.innerHTML = "";
const rowLabels = ["Добро (Позитив)", "Нейтральность", "Зло (Негатив)"];
for (let r = 0; r < 3; r++) {
const lbl = document.createElement("div");
lbl.className = "row-label";
lbl.textContent = rowLabels.at(r);
grid.appendChild(lbl);
for (let c = 0; c < 3; c++) {
const slotIdx = r * 3 + c;
const slot = document.createElement("div");
slot.className = "slot";
slot.onclick = () => toggleReveal(slotIdx);
if (state.spread.length < 9) {
slot.innerHTML = "" + ALIGNMENTS.at(slotIdx) + "Пусто";
} else {
const card = DECK.at(state.spread.at(slotIdx));
const isRev = state.revealed.at(slotIdx);
const isSuitMatch = isRev && card.suit === ch.suit;
const roleOwners = state.players.filter(p => p.roleCardId === card.id);
if (isRev && roleOwners.length > 0) slot.classList.add("role-match");
else if (isSuitMatch) slot.classList.add("suit-match");
if (!isRev) {
slot.innerHTML =
"" + ALIGNMENTS.at(slotIdx) + "" +
"✦" +
"Нажмите, чтобы открыть";
} else {
let tagsHtml = "";
if (isSuitMatch) tagsHtml += "Масть главы (+1 ОХ)";
roleOwners.forEach(owner => {
if (card.alignIdx === slotIdx) {
tagsHtml += "★ Роль: " + owner.name + " (Истинное +2)";
} else if (OPPOSITE_SLOTS.at(card.alignIdx) === slotIdx) {
tagsHtml += "⚠ Роль: " + owner.name + " (Противопол. +1)";
} else {
tagsHtml += "Роль: " + owner.name + " (+1 ОХ)";
}
});
slot.innerHTML =
"" + ALIGNMENTS.at(slotIdx) + "" +
"" +
"" +
"" + card.ru + " (" + card.en + ")" +
"" + SUITS[card.suit].name + " • " + ALIGNMENTS.at(card.alignIdx) + "" +
"" + tagsHtml + "" +
"";
}
}
grid.appendChild(slot);
}
